services:
  fault-provider:
    profiles: ["fault-injection"]
    build:
      context: ./apps/api
    command: ["uvicorn", "tests.support.fault_provider:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ASF_FAULT_TIMEOUT_SECONDS: ${ASF_FAULT_TIMEOUT_SECONDS:-5}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 20
