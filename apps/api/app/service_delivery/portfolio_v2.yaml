version: "2.0"
status: candidate
journey:
  - Identificar oportunidades
  - Priorizar investimentos
  - Estabelecer governança
  - Implantar capacidades
  - Validar casos de uso
  - Acelerar adoção
  - Operar continuamente
corporate_definition_of_done:
  - Todos os processos previstos no escopo foram executados.
  - Todos os entregáveis obrigatórios estão disponíveis.
  - Os critérios de aceite específicos foram validados.
  - Riscos, limitações e dependências estão documentados.
  - Os responsáveis pela continuidade estão definidos.
  - Os treinamentos e o handover previstos foram realizados.
  - Os acessos e repositórios estão organizados.
  - O backlog de evolução está consolidado.
  - A apresentação executiva de encerramento foi realizada.
  - O cliente recebeu os materiais em formato utilizável e editável.
external_constraints:
  - adesão integral dos usuários
  - resultados financeiros futuros
  - disponibilização tardia de dados
  - aprovações de áreas externas
  - indisponibilidade de fornecedores
  - integrações não previstas
  - mudanças de escopo
  - alterações organizacionais
  - decisões posteriores do cliente
commitment: Implantar a capacidade contratada, comprovar seu funcionamento, documentar os resultados e preparar a organização para operar e evoluir a solução.
offerings:
  - code: ai_value_discovery
    display_name: AI Value Discovery
    description: Serviço de diagnóstico e planejamento que identifica onde a inteligência artificial pode gerar maior valor para a organização.
    journey_stage: Identificar oportunidades e priorizar investimentos
    category: entry_service
    duration_label: 4–6 semanas
    cadence: one_off
    component_codes: [ai_value_discovery]
    team: [engagement_planner, process_value_analyst, solution_platform_architect, deliverable_quality_curator]
    process:
      - name: Alinhamento estratégico
        mode: human
        activities: [entendimento dos objetivos organizacionais, levantamento das prioridades do negócio, identificação das áreas envolvidas, definição dos critérios de valor, alinhamento sobre restrições e premissas]
      - name: Diagnóstico de maturidade
        mode: agent
        activities: [estratégia, dados, tecnologia, processos, pessoas, governança, segurança, cultura, capacidade de execução]
      - name: Mapeamento dos processos
        mode: agent
        activities: [identificação dos principais processos, levantamento de tarefas manuais, identificação de gargalos, análise de atividades repetitivas, levantamento de sistemas e dados envolvidos, identificação dos pontos de decisão humana]
      - name: Identificação dos casos de uso
        mode: agent
        activities: [impacto financeiro, ganho de produtividade, redução de risco, melhoria da experiência, disponibilidade de dados, dependência de integração, esforço organizacional, criticidade do processo]
      - name: Priorização
        mode: agent
        activities: [classificação dos casos de uso, matriz valor versus complexidade, quick wins, iniciativas estruturantes, seleção do portfólio inicial]
      - name: Construção do roadmap
        mode: agent
        activities: [organização das iniciativas, identificação das dependências, definição da sequência recomendada, definição das capacidades necessárias, construção da visão de evolução]
    deliverables: [diagnóstico de maturidade em IA, mapa dos processos analisados, inventário de oportunidades, fichas detalhadas dos casos de uso, matriz de impacto risco e complexidade, ranking de oportunidades, business cases preliminares, mapa de dependências, arquitetura de referência, roadmap corporativo de IA, apresentação executiva para decisão]
    definition_of_done: [as áreas previstas foram analisadas, os processos prioritários foram documentados, as oportunidades foram registradas, os casos de uso foram avaliados por critérios comuns, o portfólio prioritário foi definido, premissas riscos e dependências foram documentados, o roadmap foi consolidado, a recomendação executiva foi apresentada, os materiais foram entregues em formato editável]

  - code: ai_governance_risk_framework
    display_name: AI Governance & Risk Framework
    description: Serviço de criação e implantação do modelo corporativo de governança, segurança e gestão de riscos relacionados à inteligência artificial.
    journey_stage: Estabelecer governança
    category: productized_service
    duration_label: 6–8 semanas
    cadence: one_off
    component_codes: [responsible_ai_governance]
    team: [engagement_planner, governance_risk_specialist, deliverable_quality_curator]
    process:
      - name: Inventário de IA
        mode: agent
        activities: [identificação das soluções em uso, levantamento dos fornecedores, identificação dos modelos utilizados, levantamento dos dados processados, identificação dos responsáveis, registro dos casos de uso existentes]
      - name: Classificação de riscos
        mode: agent
        activities: [privacidade, segurança, dados confidenciais, propriedade intelectual, viés, decisões automatizadas, transparência, alucinação, dependência de fornecedores, continuidade operacional]
      - name: Definição das políticas
        mode: agent
        activities: [política de uso aceitável, política de dados, política de ferramentas autorizadas, política de desenvolvimento, política de validação, política de supervisão humana, política de monitoramento]
      - name: Modelo de governança
        mode: agent
        activities: [definição dos fóruns, estabelecimento dos papéis, matriz de responsabilidades, fluxo de aprovação, processo de exceções, processo de escalonamento]
      - name: Controles operacionais
        mode: agent
        activities: [checklists de avaliação, formulários de aprovação, registro de evidências, avaliação de fornecedores, documentação dos sistemas, processo de incidentes, processo de revisão periódica]
    deliverables: [inventário corporativo de IA, política corporativa de IA, catálogo de riscos, matriz de classificação, RACI de governança, fluxo de submissão e aprovação, checklist de avaliação de casos de uso, checklist de avaliação de fornecedores, modelo de AI System Card, modelo de registro de decisões, processo de gestão de incidentes, modelo de auditoria, painel inicial de governança]
    definition_of_done: [o inventário inicial foi consolidado, os riscos foram classificados, as políticas foram documentadas, os papéis foram definidos, o processo de aprovação foi estabelecido, os templates foram disponibilizados, casos reais foram avaliados pelo framework, o processo de incidente foi validado, o repositório de governança foi organizado, os responsáveis foram habilitados para operar o modelo]

  - code: ai_enterprise_launchpad
    display_name: AI Enterprise Launchpad
    description: Programa responsável por transformar a estratégia de IA em capacidades organizacionais concretas.
    journey_stage: Implantar capacidades
    category: implementation_program
    duration_label: 8–12 semanas
    cadence: one_off
    component_codes: [ai_enterprise_launchpad]
    team: [engagement_planner, solution_platform_architect, enablement_handover_specialist, governance_risk_specialist, deliverable_quality_curator]
    process:
      - name: Preparação organizacional
        mode: human
        activities: [alinhamento executivo, definição dos objetivos, identificação das áreas, seleção dos casos de uso, definição dos responsáveis, levantamento das plataformas disponíveis]
      - name: Desenho do modelo operacional
        mode: agent
        activities: [papéis e responsabilidades, processo de entrada de demandas, fluxo de avaliação, modelo de priorização, processo de implantação, suporte aos usuários, gestão dos ativos, medição dos resultados]
      - name: Configuração das plataformas
        mode: integration
        activities: [definição das ferramentas, configuração dos ambientes, definição dos acessos, configuração das políticas, organização dos espaços, criação dos padrões de utilização]
      - name: Construção das capacidades iniciais
        mode: agent
        activities: [biblioteca de prompts, assistentes, agentes, templates, workflows, playbooks, guias por área, base de conhecimento]
      - name: Ativação das áreas
        mode: human
        activities: [treinamento, onboarding, experimentação controlada, coleta de feedback, ajustes nos casos de uso, preparação dos líderes e champions]
      - name: Medição e expansão
        mode: agent
        activities: [instrumentação dos indicadores, análise dos resultados, identificação de melhorias, priorização das próximas áreas, consolidação do plano de escala]
    deliverables: [modelo operacional de IA, estrutura de governança inicial, catálogo de casos de uso, ambientes configurados, biblioteca de prompts, assistentes e workflows, playbooks por área, guias de utilização, materiais de treinamento, modelo de champions, dashboard executivo, dashboard de adoção, backlog de evolução, plano de expansão]
    definition_of_done: [o modelo operacional foi documentado, as ferramentas previstas foram configuradas, os acessos foram validados, os casos de uso foram implantados, os fluxos foram testados pelas áreas, os usuários responsáveis foram treinados, a governança foi aplicada, os indicadores foram disponibilizados, os riscos conhecidos foram registrados, o plano de expansão foi consolidado, o handover foi realizado]

