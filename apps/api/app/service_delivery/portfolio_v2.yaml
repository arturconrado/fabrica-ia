  - code: ai_use_case_pilot_sprint
    display_name: AI Use Case Pilot
    description: Serviço destinado a validar um caso de uso específico antes de sua transformação em solução produtiva.
    journey_stage: Validar casos de uso
    category: validation_service
    duration_label: 4–8 semanas
    cadence: one_off
    component_codes: [rapid_mvp_factory]
    team: [engagement_planner, solution_platform_architect, deliverable_quality_curator]
    process:
      - name: Definição do problema
        mode: human
        activities: [descrição da necessidade, identificação dos usuários, mapeamento da jornada atual, definição das entradas e saídas, estabelecimento dos critérios de sucesso, identificação das restrições]
      - name: Desenho da solução
        mode: agent
        activities: [arquitetura, componentes, dados, modelos, integrações, controles, pontos de supervisão humana, estratégia de avaliação]
      - name: Preparação dos dados
        mode: integration
        activities: [identificação das fontes, extração, organização, normalização, classificação, controle de acesso, construção do dataset de teste]
      - name: Construção do piloto
        mode: technical_run
        activities: [configuração das ferramentas, criação dos fluxos, construção dos prompts, desenvolvimento das integrações previstas, implementação da interface, implementação dos controles]
      - name: Avaliação
        mode: technical_run
        activities: [testes funcionais, avaliação de precisão, avaliação de grounding, testes de segurança, avaliação de experiência, análise dos custos, identificação das limitações]
      - name: Recomendação de evolução
        mode: agent
        activities: [consolidação dos resultados, identificação das lacunas, definição do backlog produtivo, recomendação de continuidade, proposta de arquitetura futura]
    deliverables: [documento do problema, desenho funcional, arquitetura da solução, piloto funcional, dataset de avaliação, integrações previstas, relatório de testes, relatório de segurança, relatório de qualidade, demonstração executiva, backlog produtivo, mapa de riscos, recomendação de evolução]
    definition_of_done: [o fluxo previsto funciona de ponta a ponta, os dados definidos estão disponíveis, as integrações previstas foram validadas, os testes foram executados, os resultados foram registrados, os riscos e limitações foram documentados, a demonstração foi realizada, o backlog produtivo foi construído, a recomendação de continuidade foi formalizada]
    valid_terminal_outcomes: [viable, infeasible_with_evidence]

